[www]
; Listen on the internal Docker network only; Nginx is the only client.
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Health check endpoint (cgi-fcgi), never routed through Nginx.
ping.path = /fpm-ping
ping.response = pong

; Send worker output to the container log.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
