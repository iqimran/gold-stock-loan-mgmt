; Production-safe defaults (development.ini overrides for local work).
expose_php = Off
memory_limit = 256M
upload_max_filesize = 5M
post_max_size = 6M
max_execution_time = 60
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is baked into the production image, so files never change at runtime.
opcache.validate_timestamps = 0

display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
